name: Stable Release
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: "stable-release"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v6
 
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
 
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
 
      - name: Decode CloudX signing keystore
        run: |
          echo "${{ secrets.CLOUDX_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/cloudx-release.jks"
 
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
 
      - name: Build Stable APK
        run: ./gradlew assembleStableRelease androidSourcesJar makeJar
        env:
          CLOUDX_KEYSTORE_PATH: ${{ runner.temp }}/cloudx-release.jks
          CLOUDX_KEYSTORE_PASSWORD: ${{ secrets.CLOUDX_KEYSTORE_PASSWORD }}
          CLOUDX_KEY_ALIAS: ${{ secrets.CLOUDX_KEY_ALIAS }}
          CLOUDX_KEY_PASSWORD: ${{ secrets.CLOUDX_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
 
      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
 
      - name: Create Stable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "CloudX ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/stable/release/*.apk
            app/build/libs/app-sources.jar
            app/build/classes.jar
